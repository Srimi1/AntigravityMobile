name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "claude/anti-gravity-report-security-n3ndgn" ]
    paths: [ "android/**", ".github/workflows/android-apk.yml" ]

jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Validates gradle-wrapper.jar against Gradle's official checksums.
      - uses: gradle/actions/setup-gradle@v4

      # The keystore is not committed to the repo. Create a fresh one for this build so
      # the release APK (minified, not debuggable) is signed and installable.
      # Keep the same key between builds if you want to update the app in place.
      - name: Create signing key
        run: |
          mkdir -p keystore
          keytool -genkeypair -keystore keystore/release.jks -storepass antigravity \
            -keypass antigravity -alias antigravity -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Antigravity Mobile"

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Show build tools and APK info
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          ls -l "$APK"
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs "$APK" || true
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: AntigravityMobile-arm64-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
